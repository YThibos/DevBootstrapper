# DevBootstrapper prompt (STARSHIP_CONFIG). Shows the active git identity context inside repositories.
"$schema" = "https://starship.rs/config-schema.json"
add_newline = false
format = "$directory$git_branch$git_state$git_status${custom.gitid}$java$nodejs$python$cmd_duration$line_break$character"

[directory]
truncation_length = 4
truncate_to_repo = false

[custom.gitid]
command = "gitid prompt"
require_repo = true
format = "[@$output]($style) "
style = "bold purple"
shell = ["bash", "--noprofile", "--norc"]

[java]
format = "[$symbol$version]($style) "

[nodejs]
format = "[$symbol$version]($style) "

[python]
format = "[$symbol$version]($style) "

[cmd_duration]
min_time = 3000
