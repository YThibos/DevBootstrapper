# DevBootstrapper tmux configuration, linked from ~/.tmux.conf.
# The default prefix (Ctrl-b) is kept so agent tooling and muscle memory stay compatible.
#: Ctrl-b c | new window
#: Ctrl-b " / Ctrl-b % | split pane below / beside
#: Ctrl-b d | detach (tm reattaches)
#: Ctrl-b [ | scroll / copy mode (q to leave)

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,wezterm:RGB"
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
# Lets the shell tell WezTerm its directory and ssh state (bash/tools/wezterm.sh).
set -g allow-passthrough on
set -g status-style "bg=default,fg=colour245"
set -g status-left "#[bold]#S #[default]"
set -g status-right "%H:%M"
