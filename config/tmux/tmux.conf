# DevBootstrapper tmux configuration. devup renders this template into .local/tmux/tmux.conf and
# links that file from ~/.tmux.conf.
# The default prefix (Ctrl-b) is kept: WezTerm sends it to drive tmux (docs/wezterm.md), and
# agent tooling and muscle memory stay compatible.
## Template: {{DEV_SHELL}} is the machine's interactive shell, bash or zsh (docs/shell.md).
#: Ctrl-b c | new window
#: Ctrl-b " / Ctrl-b % | split pane below / beside
#: Ctrl-b d | detach (tm reattaches)
#: Ctrl-b [ | scroll / copy mode (q to leave)

# Every pane starts the machine's shell as a login shell, so tmux sessions get the same
# environment as a plain terminal tab.
set -g default-command "{{DEV_SHELL}} -l"
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,wezterm:RGB"
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
# The terminal's title is the session name, so WezTerm can give a session its own look (EDI's face
# for edi-<yymmdd>-<hhmm>, docs/wezterm.md). Set for every session: tmux sends no title when a
# client switches from a session without titles to one that turns them on.
set -g set-titles on
set -g set-titles-string "#S"
# Lets the shell tell WezTerm its directory and ssh state (bash/tools/wezterm.sh).
set -g allow-passthrough on
set -g status-style "bg=default,fg=colour245"
set -g status-left "#[bold]#S #[default]"
set -g status-right "%H:%M"
